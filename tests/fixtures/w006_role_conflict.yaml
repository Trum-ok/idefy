version: 1
model:
  name: "Конфликт ролей"
  purpose: "Проверить W006"
  viewpoint: "Аналитик"
activities:
  - id: A0
    name: "Обработать заявку"
    input: [ "Заявка" ]
    control: [ "Регламент" ]
    output: [ "Решение" ]
  - id: A1
    name: "Проверить заявку"
    input: [ "Заявка" ]
    control: [ "Регламент" ]
    output: [ "Проверенная заявка" ]
  - id: A2
    name: "Оценить риск"
    input: [ "Проверенная заявка" ]
    control: [ "Регламент" ]
    output: [ "Оценка риска" ]
  - id: A3
    name: "Принять решение"
    input: [ "Оценка риска" ]
    control: [ "Регламент", "Проверенная заявка" ]
    output: [ "Решение" ]
