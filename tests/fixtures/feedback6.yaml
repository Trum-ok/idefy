version: 1
model:
  name: "Шесть блоков с обратной связью"
  author: "Тест"
  purpose: "Проверить раскладку на шести блоках"
  viewpoint: "Аналитик"
activities:
  - id: A0
    name: "Изготовить изделие"
    input: [ "Заказ" ]
    control: [ "Технические условия" ]
    output: [ "Изделие" ]
    mechanism: [ "Цех" ]
  - id: A1
    name: "Принять заказ"
    input: [ "Заказ" ]
    control: [ "Технические условия" ]
    output: [ "Спецификация" ]
    mechanism: [ "Цех" ]
  - id: A2
    name: "Разработать маршрут"
    input: [ "Спецификация" ]
    control: [ "Технические условия" ]
    output: [ "Маршрутная карта" ]
    mechanism: [ "Цех" ]
  - id: A3
    name: "Подготовить оснастку"
    input: [ "Маршрутная карта" ]
    control: [ "Технические условия" ]
    output: [ "Оснастка" ]
    mechanism: [ "Цех" ]
  - id: A4
    name: "Изготовить деталь"
    input: [ "Оснастка" ]
    control: [ "Технические условия", "Протокол дефектов" ]
    output: [ "Деталь" ]
    mechanism: [ "Цех" ]
  - id: A5
    name: "Проконтролировать качество"
    input: [ "Деталь" ]
    control: [ "Технические условия" ]
    output: [ "Годная деталь", "Протокол дефектов" ]
    mechanism: [ "Цех" ]
  - id: A6
    name: "Собрать изделие"
    input: [ "Годная деталь" ]
    control: [ "Технические условия" ]
    output: [ "Изделие" ]
    mechanism: [ "Цех" ]
