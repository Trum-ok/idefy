version: 1
model:
  name: "Непроброшенный ICOM"
  purpose: "Проверить E007"
  viewpoint: "Аналитик"
activities:
  - id: A0
    name: "Обработать заявку"
    input: [ "Заявка" ]
    control: [ "Регламент", "Инструкция" ]
    output: [ "Решение" ]
  - id: A1
    name: "Проверить заявку"
    input: [ "Заявка" ]
    control: [ "Регламент" ]
    output: [ "Проверенная заявка" ]
  - id: A2
    name: "Принять решение"
    input: [ "Проверенная заявка" ]
    control: [ "Регламент" ]
    output: [ "Решение" ]
