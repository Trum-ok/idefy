version: 1
model:
  name: "Два уровня декомпозиции"
  author: "Тест"
  purpose: "Проверить вложенность и связь граничных стрелок с ICOM родителя"
  viewpoint: "Аналитик"
activities:
  - id: A0
    name: "Обработать заявку"
    input: [ "Заявка" ]
    control: [ "Регламент" ]
    output: [ "Решение" ]
    mechanism: [ "Аналитик" ]
  - id: A1
    name: "Проверить заявку"
    input: [ "Заявка" ]
    control: [ "Регламент" ]
    output: [ "Проверенная заявка" ]
    mechanism: [ "Аналитик" ]
  - id: A2
    name: "Оценить риск"
    input: [ "Проверенная заявка" ]
    control: [ "Регламент" ]
    output: [ "Оценка риска" ]
    mechanism: [ "Аналитик" ]
  - id: A3
    name: "Принять решение"
    input: [ "Оценка риска" ]
    control: [ "Регламент" ]
    output: [ "Решение" ]
    mechanism: [ "Аналитик" ]
  - id: A11
    name: "Принять документы"
    input: [ "Заявка" ]
    control: [ "Регламент" ]
    output: [ "Комплект документов" ]
    mechanism: [ "Аналитик" ]
  - id: A12
    name: "Сверить данные"
    input: [ "Комплект документов" ]
    control: [ "Регламент" ]
    output: [ "Сверенные данные" ]
    mechanism: [ "Аналитик" ]
  - id: A13
    name: "Оформить результат"
    input: [ "Сверенные данные" ]
    control: [ "Регламент" ]
    output: [ "Проверенная заявка" ]
    mechanism: [ "Аналитик" ]
