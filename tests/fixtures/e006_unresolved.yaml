version: 1
model:
  name: "Неразрешённая стрелка"
  purpose: "Проверить E006"
  viewpoint: "Аналитик"
activities:
  - id: A0
    name: "Обработать заявку"
    input: [ "Заявка" ]
    control: [ "Регламент" ]
    output: [ "Решение", "Уведомление" ]
  - id: A1
    name: "Проверить заявку"
    input: [ "Заявка" ]
    control: [ "Регламент" ]
    output: [ "Проверенная заявка" ]
  - id: A2
    name: "Принять решение"
    input: [ "проверенная заявка" ]
    control: [ "Регламент" ]
    output: [ "Решение" ]
  - id: A3
    name: "Уведомить клиента"
    input: [ "Решение" ]
    control: [ "Регламент" ]
    output: [ "Уведомление" ]
