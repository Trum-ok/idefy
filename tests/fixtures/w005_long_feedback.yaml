version: 1
model:
  name: "Длинная обратная связь"
  purpose: "Проверить W005"
  viewpoint: "Аналитик"
activities:
  - id: A0
    name: "Обработать заявку"
    input: [ "Заявка" ]
    control: [ "Регламент" ]
    output: [ "Решение" ]
  - id: A1
    name: "Проверить заявку"
    input: [ "Заявка" ]
    control: [ "Регламент", "Замечания" ]
    output: [ "Проверенная заявка" ]
  - id: A2
    name: "Оценить риск"
    input: [ "Проверенная заявка" ]
    control: [ "Регламент" ]
    output: [ "Оценка риска" ]
  - id: A3
    name: "Согласовать оценку"
    input: [ "Оценка риска" ]
    control: [ "Регламент" ]
    output: [ "Согласованная оценка" ]
  - id: A4
    name: "Принять решение"
    input: [ "Согласованная оценка" ]
    control: [ "Регламент" ]
    output: [ "Решение", "Замечания" ]
